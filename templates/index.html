
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT to GPA Predictor</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e3a9a9, #8b2be2);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;
    text-align: center;
}

h1 { color: white; font-size: 34px; }
.subtitle { color: #eeeaff; margin-bottom: 28px; }

.card {
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 15px 40px #2223;
    text-align: left;
}

label {
    display: block;
    color: #29345c;
    font-weight: bold;
    margin-bottom: 12px;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 17px;
    border: 2px solid #dce1f0;
    border-radius: 10px;
    margin-bottom: 20px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #3b4255, #8b2be2);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover { opacity: 0.9; }

#result {
    display: none;
    margin-top: 25px;
    padding: 22px;
    background: #effbf2;
    border-radius: 12px;
    text-align: center;
}

#result h2, #gpa { color: #159447; }
#gpa { font-size: 38px; font-weight: bold; }
#message { color: #555; }
.note { color: white; font-size: 13px; margin-top: 22px; }

@media (max-width: 500px) {
    h1 { font-size: 27px; }
    .card { padding: 22px; }
}
</style>
</head>

<body>
<div class="container">
    <h1>🎓 SAT to GPA Predictor</h1>
    <p class="subtitle">Predict your GPA using your SAT score</p>

    <div class="card">
        <label for="sat">Enter SAT Score (1600-2100)</label>
        <input type="number" id="sat" min="1600" max="2100"
               placeholder="Enter SAT score">

        <button onclick="predictGPA()">Predict GPA </button>

        <div id="result">
            <h2>Predicted GPA</h2>
            <div id="gpa"></div>
            <p id="message"></p>
        </div>
    </div>

</div>

<script>
async function predictGPA() {
    const sat = document.getElementById("sat").value;
    const result = document.getElementById("result");

    if (sat === "" || Number(sat) < 1600 || Number(sat) > 2100) {
        alert("Enter an SAT score between 1600 and 2100.");
        return;
    }

    try {
        const response = await fetch("/predict", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({sat_score: Number(sat)})
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.error || "Prediction failed");

        document.getElementById("gpa").textContent =
            Number(data.gpa).toFixed(2) + " / 4.00";

        document.getElementById("message").textContent =
            "Estimated GPA for SAT score " + sat;

        result.style.display = "block";
    } catch (error) {
        alert("Unable to predict. Check whether the Flask server is running.");
    }
}
</script>
</body>
</html>
